services:
  api:
    image: gradient-api
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MAX_CONCURRENT_RUNS: "4"
      # "demo" upgrades plans without taking payment; set "disabled" until a payment provider is wired in.
      BILLING_MODE: demo
    volumes:
      - gradient-data:/data
    # Learner code runs inside this container. Keep it off the network and
    # unprivileged until runs move to dedicated sandbox pods.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 4g

  web:
    image: gradient-web
    build:
      context: web
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  gradient-data:
